<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中間テスト暗記ハブ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          },
          animation: {
            'blob': 'blob 14s infinite alternate ease-in-out',
          },
          keyframes: {
            blob: {
              '0%':   { transform: 'translate(0px, 0px) scale(1)' },
              '33%':  { transform: 'translate(40px, -60px) scale(1.15)' },
              '66%':  { transform: 'translate(-30px, 30px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    .bg-aurora {
      background-color: #0b1020;
      background-image:
        radial-gradient(at 0% 0%,   rgba(20, 184, 166, 0.22) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.20) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(244, 63, 94, 0.18) 0px, transparent 50%);
      background-attachment: fixed;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .card-hover-effect {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover-effect:hover,
    .card-hover-effect:focus-visible {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 20px 36px -12px var(--glow, rgba(99,102,241,.5));
      outline: none;
    }

    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }
  </style>
</head>

<body class="bg-aurora min-h-full font-sans text-slate-100 antialiased selection:bg-teal-400 selection:text-slate-900 relative overflow-x-hidden flex flex-col justify-between">

  <!-- Ambient Light Blobs -->
  <div class="fixed top-0 left-1/4 w-96 h-96 bg-teal-400/20 rounded-full blur-3xl pointer-events-none animate-blob"></div>
  <div class="fixed top-1/3 right-1/4 w-96 h-96 bg-violet-500/25 rounded-full blur-3xl pointer-events-none animate-blob animation-delay-2000"></div>
  <div class="fixed bottom-10 left-1/3 w-96 h-96 bg-rose-400/20 rounded-full blur-3xl pointer-events-none animate-blob animation-delay-4000"></div>

  <div class="relative z-10 max-w-xl mx-auto px-4 py-10 sm:py-14 w-full">

    <!-- Header -->
    <header class="mb-8 sm:mb-10">
      <p class="text-xs sm:text-sm font-semibold tracking-widest text-teal-200/80 mb-2">中間テスト対策</p>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">中間テスト暗記ハブ</h1>
      <p class="mt-2 text-sm sm:text-base text-slate-300">教科を選んで、暗記スタート。</p>
    </header>

    <!-- Status -->
    <div class="glass-card rounded-2xl px-5 py-4 mb-6 flex items-center justify-between">
      <div>
        <div class="text-xs text-slate-400">学習ステータス</div>
        <div class="text-sm font-bold text-white">テストまでコツコツ</div>
      </div>
      <span id="countBadge" class="text-xs font-bold text-teal-200">全4教科</span>
    </div>

    <!-- Site List -->
    <main id="list" class="space-y-4"></main>

    <p class="mt-8 text-center text-xs text-slate-400">
      スマホの「ホーム画面に追加」をすると、アプリのように開けます。
    </p>

  </div>

  <footer class="py-6 text-center text-xs text-slate-500 relative z-10">
    <p>中間テスト暗記ハブ</p>
  </footer>

<script>
  // 教科を増やすときは、ここに1つ追加するだけ
  // from / to : 左のラインと番号バッジのグラデーション色
  const sites = [
    { name: "地学",           from: "#34d399", to: "#14b8a6", note: "",         url: "https://husitou.github.io/tyuukantigaku/" },
    { name: "プログラミング", from: "#818cf8", to: "#3b82f6", note: "",         url: "https://husitou.github.io/tyuukanpuroguramingu/" },
     { name: "情報処理",           from: "#fb7185", to: "#ecb8a9", note: "", url: "https://husitou.github.io/tyuukanzyousyo/" },
    { name: "ビジネス基礎",   from: "#fbbf24", to: "#f97316", note: "",         url: "https://husitou.github.io/biziki1/" },
    { name: "公共令和最新版",           from: "#fb1185", to: "#ec5555", note: "", url: "https://husitou.github.io/tyuukankoukyousaisinban/" },
     { name: "公共(あまり信用できない)",           from: "#fb7185", to: "#ec4899", note: "のざき作", url: "https://husitou.github.io/-n/" },
    { name: "公共そうし版(あまり信用できない)",           from: "#fb7185", to: "#ea4811", note: "そうし作", url: "https://husitou.github.io/tyuukankoukyou/" },
  ];

  const list = document.getElementById("list");
  document.getElementById("countBadge").textContent = `全${sites.length}教科`;

  sites.forEach((s, i) => {
    const num = String(i + 1).padStart(2, "0");
    const host = s.url.replace(/^https?:\/\//, "").replace(/\/$/, "");

    const a = document.createElement("a");
    a.href = s.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.className = "group glass-card block rounded-2xl p-5 card-hover-effect relative overflow-hidden";
    a.style.setProperty("--glow", s.from + "66");

    a.innerHTML = `
      <div class="absolute top-0 left-0 bottom-0 w-1.5"
           style="background: linear-gradient(to bottom, ${s.from}, ${s.to});"></div>

      <div class="flex items-center justify-between pl-2">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl flex items-center justify-center text-base font-bold text-white"
               style="background: linear-gradient(135deg, ${s.from}, ${s.to});">${num}</div>
          <div>
            <h2 class="js-name text-lg font-bold text-white"></h2>
            <div class="js-note text-xs text-slate-400"></div>
          </div>
        </div>
        <span class="text-sm font-semibold group-hover:underline" style="color:${s.from}">開く</span>
      </div>

      <div class="js-host mt-3 pl-2 pt-3 border-t border-white/10 text-xs font-mono text-slate-500 truncate"></div>
    `;

    a.querySelector(".js-name").textContent = s.name;
    a.querySelector(".js-host").textContent = host;
    const note = a.querySelector(".js-note");
    if (s.note) note.textContent = "作成：" + s.note; else note.remove();

    list.appendChild(a);
  });
</script>
</body>
</html>
